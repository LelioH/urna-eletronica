name: Bug report
description: Report an observable problem in the simulator.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include vote numbers, candidate names, party names, vote state, browser identifiers,
        or personal data. This simulator does not store votes.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible behavior without sensitive or preference-revealing data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open the demo\n2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device category
      placeholder: Firefox on desktop, Safari on mobile
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed vote preferences, identifiers, and personal data from this report.
          required: true
